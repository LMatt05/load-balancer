events {
    worker_connections 4096;
}

http {
    access_log off;

    upstream rr {
        server backend-1:80;
        server backend-2:80;
        server backend-3:80;
        keepalive 64;
    }

    upstream lc {
        least_conn;
        server backend-1:80;
        server backend-2:80;
        server backend-3:80;
        keepalive 64;
    }

    server {
        listen 80;
        location / {
            proxy_pass http://rr;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }

    server {
        listen 81;
        location / {
            proxy_pass http://lc;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}