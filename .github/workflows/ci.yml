name: CI
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up JDK 23
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '23'
          cache: maven

      - name: build and test
        run: ./mvn -B verify
