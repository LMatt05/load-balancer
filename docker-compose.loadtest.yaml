# Load-test overlay. Always use it together with the main file:
#   docker compose -f docker-compose.yml -f docker-compose.loadtest.yml up -d --build
x-sim-backend: &sim-backend
  image: python:3.12-alpine
  command: ["python", "-u", "/app/sim_backend.py"]
  volumes:
    - ./loadtest/sim_backend.py:/app/sim_backend.py:ro

services:
  backend-1:
    <<: *sim-backend
    environment:
      NAME: backend-1
      DELAY_MS: "20"
      MAX_CONCURRENCY: "8"

  backend-2:
    <<: *sim-backend
    environment:
      NAME: backend-2
      DELAY_MS: "20"
      MAX_CONCURRENCY: "8"

  backend-3:
    <<: *sim-backend
    environment:
      NAME: backend-3
      DELAY_MS: "100"
      MAX_CONCURRENCY: "8"

  nginx:
    image: nginx:1.27-alpine
    container_name: nginx
    volumes:
      - ./loadtest/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend-1
      - backend-2
      - backend-3

  k6:
    image: grafana/k6:1.0.0
    profiles: ["loadtest"]
    user: root
    volumes:
      - ./loadtest:/loadtest